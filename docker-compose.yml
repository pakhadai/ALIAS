services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: movli
      POSTGRES_USER: movli
      POSTGRES_PASSWORD: movli_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - '3001:3001'
    # Секрети — у кореневому `.env.prod` (шаблон: `.env.prod.example`); не комітити.
    env_file:
      - .env.prod
    environment:
      PORT: 3001
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://movli:movli_dev@postgres:5432/movli
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
      # Решта — з `.env.prod` (див. `.env.prod.example`)
    depends_on:
      - redis
      - postgres

volumes:
  redis-data:
  postgres-data:
