# DEPRECATED as a direct bind-mount for production.
#
# Production (host owns 80/443, no Nginx Proxy Manager):
#   Use nginx/nginx.conf.template via docker-compose.prod.yml
#   (official nginx image envsubst → /etc/nginx/conf.d/default.conf).
#
# Production behind Nginx Proxy Manager (typical VPS):
#   Do NOT start the `nginx` service from docker-compose.prod.yml.
#   Use docker-compose.npm.yml + nginx/npm-edge.conf (service `gateway`).
#
# If you still see a container named like `*-nginx-1` in Restarting while
# `*-gateway-1` is healthy, it is an orphan from the prod stack — stop it:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml down
#   # or: docker rm -f <project>-nginx-1
#
# The previous hard-coded YOUR_DOMAIN placeholders caused exit 1 whenever
# this file was mounted without real domain/certs. See nginx.conf.template.
