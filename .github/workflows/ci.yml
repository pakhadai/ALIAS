name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate (TS/Lint/Unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @alias/server exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Server tests + coverage thresholds
        run: pnpm --filter @alias/server test:coverage

      - name: Client tests
        run: pnpm --filter @alias/client test

  e2e_smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: alias
          POSTGRES_USER: alias
          POSTGRES_PASSWORD: alias_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alias -d alias"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://alias:alias_dev@127.0.0.1:5432/alias?schema=public
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @alias/e2e run install:browsers

      - name: Build shared package (required by server runtime)
        run: pnpm --filter @alias/shared build

      - name: Run smoke tests only
        run: pnpm --filter @alias/e2e run test -- --grep "@smoke"

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: packages/e2e/test-results
          if-no-files-found: ignore

  e2e_core:
    name: E2E core (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: alias
          POSTGRES_USER: alias
          POSTGRES_PASSWORD: alias_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alias -d alias"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://alias:alias_dev@127.0.0.1:5432/alias?schema=public
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @alias/e2e run install:browsers

      - name: Build shared package (required by server runtime)
        run: pnpm --filter @alias/shared build

      # Run @core suite for each project separately (faster feedback / clearer failures).
      - name: Run @core on Desktop Chrome
        run: pnpm --filter @alias/e2e run test -- --grep "@core" --project=chromium

      - name: Run @core on Mobile Chrome (Pixel 5)
        run: pnpm --filter @alias/e2e run test -- --grep "@core" --project=mobile-chrome

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-core
          path: packages/e2e/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-core
          path: packages/e2e/test-results
          if-no-files-found: ignore

