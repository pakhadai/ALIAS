# ═══════════════════════════════════════════════════════════════════════════
# Production Docker Compose — OWN nginx + Let's Encrypt on host ports 80/443.
#
# ⚠ DO NOT run this stack on a VPS where Nginx Proxy Manager (or another
#   reverse proxy) already binds 80/443. That causes port conflicts and leaves
#   an orphan `*-nginx-1` container (often Restarting) while the live stack is
#   docker-compose.npm.yml + service `gateway`.
#
#   Canonical for NPM VPS:  docker-compose.npm.yml  (ONLY)
#   This file:              hosts WITHOUT NPM, with free 80/443
#
# Before `up`:
#   1. Confirm ports free:  ss -tlnp | grep -E ':80|:443'   (should be empty)
#   2. Copy .env.prod.example → .env.prod; set DOMAIN (used by nginx envsubst)
#   3. Obtain SSL cert (certbot profile) BEFORE relying on :443
#   4. Never run this compose file in parallel with docker-compose.npm.yml
#
# Usage:
#   docker compose -p movli --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# First-time SSL:
#   docker compose -p movli --env-file .env.prod -f docker-compose.prod.yml --profile certbot run --rm certbot
#
# Switch to NPM stack later — tear this stack down to avoid orphan nginx:
#   docker compose -p movli --env-file .env.prod -f docker-compose.prod.yml down
# ═══════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movli}
      POSTGRES_USER: ${POSTGRES_USER:-movli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movli}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    command: node packages/server/dist/server/src/index.js
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-movli}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-movli}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://${DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: https://${DOMAIN}/store?payment=success
      STRIPE_CANCEL_URL: https://${DOMAIN}/store
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Client — nginx serving built static files on :8080
  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      args:
        VITE_SERVER_URL: https://${DOMAIN}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_TG_APP_LINK: ${VITE_TG_APP_LINK:-}
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-https://${DOMAIN}}
    restart: unless-stopped

  # Reverse proxy — terminates SSL, routes traffic to app/client.
  # Requires DOMAIN in env (envsubst) and Let's Encrypt certs under that name.
  # NOT for NPM hosts — use docker-compose.npm.yml `gateway` instead.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.prod — required for nginx SSL paths}
      # Only substitute DOMAIN; leave nginx $host / $scheme / etc. untouched.
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - app
      - client

  # One-shot certbot — run with: docker compose ... --profile certbot run --rm certbot
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    profiles: ["certbot"]
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${SSL_EMAIL}
      --agree-tos
      --no-eff-email
      -d ${DOMAIN}

volumes:
  postgres-data:
  redis-data:
  certbot-webroot:
  certbot-certs:
