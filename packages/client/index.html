<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Telegram Mini App SDK — MUST be the first script in <head> -->
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
    <title>MOVLI Premium</title>
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="128x128" />
    <meta name="theme-color" content="#E2E3DB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MOVLI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Playfair+Display:wght@400;700;900&family=Inter:wght@400;500;600;700;800&family=Exo+2:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Google Identity Services — loaded here so it is available before any sign-in attempt -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Tailwind is built via PostCSS (no CDN in production) -->
  </head>
  <body class="overflow-hidden fixed inset-0 font-sans">
    <div id="root" class="h-full w-full overflow-x-hidden overflow-y-auto no-scrollbar"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
